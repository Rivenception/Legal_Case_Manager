{% extends "base.html" %}
{% block title %}{% if person %}Edit{% else %}Add{% endif %} contact — Case Tracker{% endblock %}
{% block content %}
<h1>{% if person %}Edit contact{% else %}Add contact{% endif %}</h1>

<form method="post" class="form-grid card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required value="{{ person.name if person else '' }}">
  </div>

  <div class="form-group">
    <label for="role">Role</label>
    <input type="text" id="role" name="role" placeholder="e.g. Neighbor, Witness, Police Officer, Mediator"
      value="{{ person.role if person else '' }}">
  </div>

  <div class="form-group">
    <label for="notes">Notes</label>
    <textarea id="notes" name="notes">{{ person.notes if person else '' }}</textarea>
  </div>

  <div class="actions">
    <button type="submit" class="btn">Save</button>
    <a href="{{ url_for('contacts.view_person', person_id=person.id) if person else url_for('contacts.list_people') }}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
