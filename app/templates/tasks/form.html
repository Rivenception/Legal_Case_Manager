{% extends "base.html" %}
{% block title %}{% if task %}Edit{% else %}Add{% endif %} task — Case Tracker{% endblock %}
{% block content %}
<h1>{% if task %}Edit task{% else %}Add task{% endif %}</h1>

<form method="post" class="form-grid card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="form-group">
    <label for="description">Description</label>
    <textarea id="description" name="description" required>{{ task.description if task else '' }}</textarea>
  </div>

  <div class="form-group">
    <label for="due_date">Due date</label>
    <input type="date" id="due_date" name="due_date" value="{{ task.due_date.strftime('%Y-%m-%d') if task and task.due_date else '' }}">
  </div>

  <div class="actions">
    <button type="submit" class="btn">Save</button>
    <a href="{{ url_for('tasks.list_tasks') }}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
{% endblock %}
