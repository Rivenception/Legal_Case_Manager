{% extends "base.html" %}
{% block title %}Forgot password — Case Tracker{% endblock %}
{% block content %}
<div class="login-wrap card">
  <h1>Forgot password</h1>
  <p class="hint">Enter your username or email. If your account has an email on file, we'll send a reset link.</p>
  <form method="post" class="form-grid">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="username_or_email">Username or email</label>
      <input type="text" id="username_or_email" name="username_or_email" required autofocus>
    </div>
    <button type="submit" class="btn">Send reset link</button>
  </form>
  <p style="margin-top: 1rem; margin-bottom: 0;">
    <a href="{{ url_for('auth.login') }}">&larr; Back to log in</a>
  </p>
</div>
{% endblock %}
